name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Static PowerShell tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run dependency-free test suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".\tests\run-tests.ps1"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
